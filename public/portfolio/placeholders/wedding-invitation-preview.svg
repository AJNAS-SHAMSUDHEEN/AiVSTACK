<svg width="800" height="1000" viewBox="0 0 800 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="1000" rx="40" fill="#140F18"/>
  <rect x="2" y="2" width="796" height="996" rx="38" stroke="#2D1F36" stroke-width="2"/>
  
  <!-- Subtle Ambient Glow -->
  <circle cx="400" cy="300" r="280" fill="#E11D48" fill-opacity="0.10" filter="blur(80px)"/>
  <circle cx="650" cy="700" r="220" fill="#C084FC" fill-opacity="0.08" filter="blur(90px)"/>
  
  <!-- Creative Web Frame Wireframe -->
  <rect x="48" y="48" width="704" height="52" rx="16" fill="#201526" stroke="#3D2949" stroke-width="1"/>
  <circle cx="80" cy="74" r="6" fill="#FB7185" fill-opacity="0.8"/>
  <circle cx="100" cy="74" r="6" fill="#F472B6" fill-opacity="0.8"/>
  <circle cx="120" cy="74" r="6" fill="#E879F9" fill-opacity="0.8"/>
  <text x="156" y="79" fill="#A892B3" font-family="system-ui, sans-serif" font-size="12" font-weight="600">https://celebration-moments.love</text>

  <!-- Content Deck Wireframe -->
  <g transform="translate(48, 130)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="240" height="34" rx="17" fill="#3D1322" stroke="#E11D48" stroke-opacity="0.5"/>
    <text x="20" y="22" fill="#FDA4AF" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CREATIVE WEB DEVELOPMENT</text>
    
    <!-- Title -->
    <text x="0" y="90" fill="#FFF1F2" font-family="system-ui, sans-serif" font-size="34" font-weight="800">Bespoke Interactive</text>
    <text x="0" y="132" fill="#FFF1F2" font-family="system-ui, sans-serif" font-size="34" font-weight="800">Wedding Invitation</text>
    <text x="0" y="172" fill="#A892B3" font-family="system-ui, sans-serif" font-size="15">Story-driven invitation with parallax RSVP and interactive timeline.</text>

    <!-- Invitation Card Mockup -->
    <rect x="0" y="210" width="704" height="340" rx="24" fill="#201526" stroke="#2D1F36"/>
    <text x="352" y="268" fill="#F472B6" text-anchor="middle" font-family="serif" font-size="28" font-style="italic">Together With Their Families</text>
    <text x="352" y="324" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, sans-serif" font-size="38" font-weight="900" letter-spacing="3">RAYAN &amp; MEERA</text>
    <text x="352" y="364" fill="#FDA4AF" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="2">DECEMBER 28, 2026 • PALACE RESORT</text>

    <!-- Countdown Chips -->
    <g transform="translate(144, 400)">
      <rect x="0" y="0" width="80" height="64" rx="12" fill="#140F18" stroke="#3D2949"/>
      <text x="40" y="36" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="800">42</text>
      <text x="40" y="52" fill="#A892B3" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600">DAYS</text>

      <rect x="110" y="0" width="80" height="64" rx="12" fill="#140F18" stroke="#3D2949"/>
      <text x="150" y="36" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="800">14</text>
      <text x="150" y="52" fill="#A892B3" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600">HOURS</text>

      <rect x="220" y="0" width="80" height="64" rx="12" fill="#140F18" stroke="#3D2949"/>
      <text x="260" y="36" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="800">18</text>
      <text x="260" y="52" fill="#A892B3" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600">MINS</text>

      <rect x="330" y="0" width="80" height="64" rx="12" fill="#140F18" stroke="#3D2949"/>
      <text x="370" y="36" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="800">55</text>
      <text x="370" y="52" fill="#A892B3" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600">SECS</text>
    </g>

    <!-- RSVP Button -->
    <rect x="252" y="490" width="200" height="44" rx="22" fill="#E11D48"/>
    <text x="352" y="518" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Digital RSVP &amp; Venue</text>
  </g>

  <!-- Technical Spec Footer Pill -->
  <g transform="translate(48, 880)">
    <rect width="704" height="60" rx="16" fill="#201526" stroke="#2D1F36"/>
    <text x="28" y="36" fill="#A892B3" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Technologies:</text>
    <text x="130" y="36" fill="#F472B6" font-family="system-ui, sans-serif" font-size="13" font-weight="700">React • Next.js • Tailwind CSS • Framer Motion</text>
    <rect x="570" y="15" width="108" height="30" rx="8" fill="#3D1322"/>
    <text x="590" y="34" fill="#FDA4AF" font-family="system-ui, sans-serif" font-size="11" font-weight="700">COMPLETED</text>
  </g>
</svg>
