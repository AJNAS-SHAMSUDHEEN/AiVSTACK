    <text x="280" y="410" fill="#8B949E" font-family="system-ui, sans-serif" font-size="13">MP4 • Video + Audio Multiplex</text>
    <text x="570" y="410" fill="#10B981" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Download</text>

    <!-- Row 2 -->
    <rect x="32" y="444" width="640" height="56" rx="12" fill="#0D1117" stroke="#30363D"/>
    <text x="56" y="478" fill="#F0F6FC" font-family="system-ui, sans-serif" font-size="15" font-weight="700">4K Ultra HD</text>
    <text x="280" y="478" fill="#8B949E" font-family="system-ui, sans-serif" font-size="13">WEBM • High-Bitrate VP9</text>
    <text x="570" y="478" fill="#10B981" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Download</text>

    <!-- Row 3 -->
    <rect x="32" y="512" width="640" height="56" rx="12" fill="#0D1117" stroke="#30363D"/>
    <text x="56" y="546" fill="#F0F6FC" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Lossless Audio Only</text>
