    <text x="0" y="172" fill="#8B949E" font-family="system-ui, sans-serif" font-size="15">Local Python FastAPI microservice wrapping yt-dlp &amp; FFmpeg.</text>

    <!-- Interactive URL Input Mockup -->
    <rect x="0" y="210" width="704" height="70" rx="18" fill="#161B22" stroke="#30363D"/>
