<svg width="800" height="1000" viewBox="0 0 800 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="1000" rx="40" fill="#0D1117"/>
  <rect x="2" y="2" width="796" height="996" rx="38" stroke="#21262D" stroke-width="2"/>
  
  <!-- Subtle Ambient Glow -->
  <circle cx="400" cy="280" r="280" fill="#DC2626" fill-opacity="0.10" filter="blur(80px)"/>
