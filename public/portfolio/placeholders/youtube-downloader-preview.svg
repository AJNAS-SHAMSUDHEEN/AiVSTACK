  <circle cx="100" cy="74" r="6" fill="#F59E0B" fill-opacity="0.8"/>
  <circle cx="120" cy="74" r="6" fill="#10B981" fill-opacity="0.8"/>
  <text x="156" y="79" fill="#8B949E" font-family="monospace" font-size="13">yt-downloader-daemon // fastapi-pipeline</text>

