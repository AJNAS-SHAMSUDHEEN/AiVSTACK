<svg width="800" height="1000" viewBox="0 0 800 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="1000" rx="40" fill="#0B131E"/>
  <rect x="2" y="2" width="796" height="996" rx="38" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Subtle Ambient Glow -->
  <circle cx="400" cy="300" r="280" fill="#059669" fill-opacity="0.12" filter="blur(80px)"/>
  <circle cx="650" cy="700" r="220" fill="#0284C7" fill-opacity="0.08" filter="blur(90px)"/>
  
  <!-- Browser Header Wireframe -->
  <rect x="48" y="48" width="704" height="52" rx="16" fill="#15202E" stroke="#334155" stroke-width="1"/>
  <circle cx="80" cy="74" r="6" fill="#EF4444" fill-opacity="0.7"/>
  <circle cx="100" cy="74" r="6" fill="#F59E0B" fill-opacity="0.7"/>
  <circle cx="120" cy="74" r="6" fill="#10B981" fill-opacity="0.7"/>
  <rect x="156" y="60" width="360" height="28" rx="8" fill="#0B131E"/>
  <text x="172" y="79" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" font-weight="600">https://initiative-giving.org</text>

  <!-- Content Deck Wireframe -->
  <g transform="translate(48, 130)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#064E3B" stroke="#059669" stroke-opacity="0.5"/>
    <text x="20" y="22" fill="#34D399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">FUNDRAISING PLATFORM</text>
    
    <!-- Hero Title Mockup -->
    <text x="0" y="90" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="34" font-weight="800">Community Support</text>
    <text x="0" y="132" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="34" font-weight="800">&amp; Relief Initiative</text>
    <text x="0" y="172" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="15">Empowering targeted causes with transparent digital donation workflows.</text>

    <!-- Contribution Goal Card -->
    <rect x="0" y="210" width="704" height="240" rx="24" fill="#15202E" stroke="#1E293B"/>
    <text x="32" y="254" fill="#64748B" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="1">CAMPAIGN TARGET</text>
    <text x="32" y="300" fill="#10B981" font-family="system-ui, sans-serif" font-size="36" font-weight="800">$120,000</text>
    <text x="210" y="300" fill="#64748B" font-family="system-ui, sans-serif" font-size="18" font-weight="600">raised of $150,000</text>

    <!-- Progress Track -->
    <rect x="32" y="330" width="640" height="14" rx="7" fill="#0B131E"/>
    <rect x="32" y="330" width="512" height="14" rx="7" fill="url(#emerald_grad)"/>
    <text x="32" y="375" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">80% Funded • 1,420 Backers • 12 Days Remaining</text>
    <rect x="520" y="358" width="152" height="42" rx="12" fill="#059669"/>
    <text x="562" y="384" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Contribute</text>

    <!-- Mini Features Grid -->
    <rect x="0" y="474" width="340" height="150" rx="20" fill="#15202E" stroke="#1E293B"/>
    <circle cx="44" cy="514" r="16" fill="#064E3B"/>
    <path d="M38 514L42 518L50 510" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="74" y="520" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Verified Payouts</text>
    <text x="44" y="556" fill="#64748B" font-family="system-ui, sans-serif" font-size="13">Direct automated settlement pipelines.</text>

    <rect x="364" y="474" width="340" height="150" rx="20" fill="#15202E" stroke="#1E293B"/>
    <circle cx="408" cy="514" r="16" fill="#064E3B"/>
    <path d="M402 514L406 518L414 510" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="438" y="520" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Real-Time Ledger</text>
    <text x="408" y="556" fill="#64748B" font-family="system-ui, sans-serif" font-size="13">Publicly transparent contribution logs.</text>
  </g>

  <!-- Technical Spec Footer Pill -->
  <g transform="translate(48, 880)">
    <rect width="704" height="60" rx="16" fill="#15202E" stroke="#1E293B"/>
    <text x="28" y="36" fill="#64748B" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Architecture:</text>
    <text x="120" y="36" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Next.js • React • Tailwind CSS • Payment Gateway</text>
    <rect x="570" y="15" width="108" height="30" rx="8" fill="#064E3B"/>
    <text x="590" y="34" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">COMPLETED</text>
  </g>

  <defs>
    <linearGradient id="emerald_grad" x1="32" y1="337" x2="544" y2="337" gradientUnits="userSpaceOnUse">
      <stop stop-color="#059669"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
  </defs>
</svg>
