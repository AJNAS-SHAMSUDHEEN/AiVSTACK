    <text x="80" y="36" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Next.js • TypeScript • PostgreSQL • Prisma ORM</text>
    <rect x="540" y="15" width="138" height="30" rx="8" fill="#1E293B"/>
    <text x="556" y="34" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="11" font-weight="700">IN DEVELOPMENT</text>
