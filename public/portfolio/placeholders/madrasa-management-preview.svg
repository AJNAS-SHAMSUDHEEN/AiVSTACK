<svg width="800" height="1000" viewBox="0 0 800 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="1000" rx="40" fill="#0C121E"/>
  <rect x="2" y="2" width="796" height="996" rx="38" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Subtle Ambient Glow -->
  <circle cx="400" cy="280" r="280" fill="#3B82F6" fill-opacity="0.10" filter="blur(80px)"/>
  <circle cx="650" cy="700" r="220" fill="#8B5CF6" fill-opacity="0.08" filter="blur(90px)"/>
  
  <!-- Management Dashboard Header -->
  <rect x="48" y="48" width="704" height="52" rx="16" fill="#162238" stroke="#253552" stroke-width="1"/>
  <circle cx="80" cy="74" r="6" fill="#60A5FA"/>
  <rect x="100" y="66" width="120" height="16" rx="6" fill="#0C121E"/>
  <rect x="520" y="60" width="200" height="28" rx="8" fill="#0C121E"/>
  <text x="540" y="78" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Admin Portal // v1.2</text>

  <!-- Content Deck Wireframe -->
  <g transform="translate(48, 130)">
