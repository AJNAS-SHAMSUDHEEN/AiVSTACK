    <!-- Administrative Table Wireframe Mockup -->
    <rect x="0" y="334" width="704" height="240" rx="20" fill="#162238" stroke="#253552"/>
    <text x="32" y="374" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Student Registry &amp; Ledger Queue</text>
    <rect x="32" y="394" width="640" height="1" fill="#253552"/>

    <!-- Row 1 -->
    <circle cx="52" cy="426" r="12" fill="#253552"/>
    <text x="76" y="430" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Ahmed Bilal — Grade 6</text>
    <rect x="540" y="414" width="100" height="24" rx="8" fill="#064E3B"/>
    <text x="562" y="430" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">FEES PAID</text>

    <!-- Row 2 -->
    <circle cx="52" cy="466" r="12" fill="#253552"/>
    <text x="76" y="470" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Zayn Malik — Grade 8</text>
    <rect x="540" y="454" width="100" height="24" rx="8" fill="#064E3B"/>
    <text x="562" y="470" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">FEES PAID</text>

    <!-- Row 3 -->
    <circle cx="52" cy="506" r="12" fill="#253552"/>
    <text x="76" y="510" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Umar Farooq — Grade 5</text>
    <rect x="540" y="494" width="100" height="24" rx="8" fill="#451A03"/>
    <text x="560" y="510" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="11" font-weight="700">DUE SOON</text>
