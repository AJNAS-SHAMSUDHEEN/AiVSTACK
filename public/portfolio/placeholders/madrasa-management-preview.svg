    <rect x="0" y="0" width="260" height="34" rx="17" fill="#1E293B" stroke="#3B82F6" stroke-opacity="0.5"/>
    <text x="20" y="22" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">EDUCATION MANAGEMENT SOFTWARE</text>
    
    <!-- Title -->
    <text x="0" y="90" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="34" font-weight="800">Madrasa Administration</text>
    <text x="0" y="132" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="34" font-weight="800">&amp; Academic Operations</text>
    <text x="0" y="172" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="15">Centralized operational ledger for student records, attendance, and fee tracking.</text>

    <!-- Stat Metric Tiles -->
    <g transform="translate(0, 210)">
      <rect x="0" y="0" width="220" height="100" rx="18" fill="#162238" stroke="#253552"/>
      <text x="24" y="38" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">ENROLLED STUDENTS</text>
      <text x="24" y="76" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="28" font-weight="800">450+</text>

      <rect x="242" y="0" width="220" height="100" rx="18" fill="#162238" stroke="#253552"/>
      <text x="266" y="38" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">ACTIVE CLASSES</text>
      <text x="266" y="76" fill="#A78BFA" font-family="system-ui, sans-serif" font-size="28" font-weight="800">18</text>

      <rect x="484" y="0" width="220" height="100" rx="18" fill="#162238" stroke="#253552"/>
      <text x="508" y="38" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">DAILY ATTENDANCE</text>
      <text x="508" y="76" fill="#34D399" font-family="system-ui, sans-serif" font-size="28" font-weight="800">96.4%</text>
